services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: psp_aggregator
      PAGARME_BASE_URL: http://mock:4000/pagarme
      PAGARME_API_KEY: test_key
      MERCADOPAGO_BASE_URL: http://mock:4000/mercadopago
      MERCADOPAGO_ACCESS_TOKEN: test_token
      SYNC_PAGE_SIZE: "20"
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: psp_aggregator
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "4000:4000"

volumes:
  db_data: